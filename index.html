function pill(p){return `<span class="pill ${p.kind==='拟开发'?'proposal':p.evidence==='待核实'?'pending':p.evidence==='公开定位'?'verified':''}">${E(p.kind==='拟开发'?'拟开发':p.evidence)}</span>`}
function selectButton(p){return `<button class="select-product" data-toggle="${p.id}" aria-pressed="${st.selected.includes(p.id)}" aria-label="${st.selected.includes(p.id)?'移出':'加入'}对比：${E(p.brand+' '+p.name)}">${I(st.selected.includes(p.id)?'tick':'plus')}</button>`}
function card(p){return `<article class="product-card ${p.kind==='拟开发'?'proposal':''} ${st.selected.includes(p.id)?'selected':''}" data-card="${p.id}"><div class="card-top"><span class="brandname">${E(p.brand)}</span>${p.region==='国际'?'<span class="small">国际</span>':''}${selectButton(p)}</div><button class="product-title" data-detail="${p.id}">${E(p.name)}</button><p>${E(p.summary)}</p><div class="card-meta">${p.users.map(u=>`<span class="pill">${E(u)}</span>`).join('')}</div><div class="card-bottom">${pill(p)}<button class="detail-link" data-detail="${p.id}">查看分析</button></div></article>`}
function filtered(){const q=st.q.trim().toLowerCase();return P.filter(p=>(st.lane==='all'||p.lane===st.lane)&&(st.who==='all'||p.users.includes(st.who))&&(st.payer==='all'||p.payers.includes(st.payer))&&(st.kind==='all'||p.kind===st.kind)&&(!q||[p.name,p.brand,p.summary,p.deliver,p.payers.join(' '),p.ai].join(' ').toLowerCase().includes(q)))}
function option(v,selected,label){return `<option value="${E(v)}" ${v===selected?'selected':''}>${E(label||v)}</option>`}
function sourceChips(ids=[]){return ids.map(id=>{const s=S.find(x=>x.id===id);return s?`<button class="evidence-tag" data-source="${id}">${E(s.title.split(' · ')[0])}</button>`:''}).join('')}

function overviewPage(){return head('是否值得组建临床医生端业务团队？','面向数智研创始人的决策首页：先判断需求是否真实、谁会付费、数智研凭什么赢，再决定是组建验证小队还是投入完整业务团队。','创始人决策总览')+`<section class="exec-hero"><span class="exec-badge">● 当前建议 · 投资验证，不直接扩张</span><h2>可以进入，但先组建“验证型小队”</h2><p>公司材料显示数智研已有约3.2亿可分析人群、多模态数据处理、医药垂类AI与RWS/RWE全流程交付能力；这说明进入临床证据服务有相邻优势，但仍不足以证明目标病种数据可用、临床医生端业务可复制，或医院/药企会按预期付费。</p><div class="action-strip"><p><span class="source-confidence">决策置信度：中等</span> · 需要用真实报价、交付、回款和复购把“需求”推进到“商业闭环”。</p><button class="btn primary" data-nav="pilot">进入90天试点</button></div></section><div class="decision-gate"><div><strong>先回答：医生究竟缺什么？</strong><p>用具体任务、发生频率、现有替代方案和净省时描述，不用“AI很需要”替代需求。</p></div><div><strong>再回答：谁拿预算？</strong><p>把医生使用者、KOL、预算负责人和付款机构拆开；接纳度不是付费率。</p></div><div><strong>最后回答：数智研凭什么赢？</strong><p>优势必须同时体现在数据可用、专业交付、AI增量和商业可重复四项材料上。</p></div></div><section><h2>三条核心信号</h2><div class="signal-grid">${EXEC_SIGNALS.map(x=>`<article class="signal-card"><span class="signal-status">${x.status}</span><h3>${x.label}</h3><p>${x.text}</p><div>${sourceChips(x.refs)}</div></article>`).join('')}</div></section><section class="section-gap"><h2>数智研已经具备什么？</h2><p class="muted small">这部分来自公司服务介绍，不是外部独立验证；它决定数智研可以从什么起跑，但不能替代新业务的订单与复购证据。</p><div class="signal-grid">${COMPANY_CAPABILITIES.map(x=>`<article class="signal-card"><span class="signal-status">${x.status}</span><h3>${x.label}</h3><p>${x.text}<br><strong>限制：</strong>${x.limit}</p><div>${sourceChips(x.refs)}</div></article>`).join('')}</div></section><section class="section-gap"><h2>五个模块的市场潜力，不是同一条赛道</h2><p class="muted small">潜力按“需求强度 × 预算可达性 × 交付可控性 × 竞争/责任风险”判断；不是行业规模排名，也不是收入预测。</p><div class="signal-grid">${MARKET_MODULES.map(x=>`<article class="signal-card"><span class="signal-status">${x.fit}</span><h3>${x.name}</h3><p><strong>购买者：</strong>${x.payer}<br><strong>闭环：</strong>${x.loop}<br><strong>限制：</strong>${x.risk}</p><div>${sourceChips(x.refs)}</div></article>`).join('')}</div></section><section class="detail-panel section-gap"><h2>最可能推翻当前建议的证据</h2><div class="journey-grid"><section><h3>需求被高估</h3><p>连续访谈中，医生都表示痛点存在，但无法指出具体任务、频率、现有替代方案或愿意让组织承担的预算。</p></section><section><h3>闭环无法成立</h3><p>只能获得免费试用或专家背书，预算负责人不出现，采购/付款路径反复变化，或项目毛利在正常报价下持续为负。</p></section><section><h3>优势不可重复</h3><p>每个项目都依赖创始人或单个KOL手工救火，数据授权和质量无法复制，AI节省的只是局部操作而不是总工时。</p></section><section><h3>更优替代方案出现</h3><p>客户更愿意购买成熟平台、院内团队或现有供应商，且数智研不能证明更快、更准、更便宜或更适配。</p></section></div><div class="action-strip"><p>下一步只需要验证三个东西：一笔真实订单、一次可复现交付、一个可解释的后续购买理由。</p><button class="btn accent" data-nav="strategy">查看完整进入判断</button></div></section>`}
function mapPage(){return head('KOL业务机会地图','沿着医生任务寻找产品，再核对付款方、竞品与交付条件。药企市场部的患者流研究，与医学部的证据服务独立呈现。')+`<div class="intro-bar"><div><strong>先验证研究与洞察服务，再决定组织投入</strong><p>初步建议：比较PI科研执行、药企市场研究和医学证据三条收入路径；患者管理需先落实预算、触达与医护响应。</p></div><button class="btn" data-nav="strategy">查看进入判断 ${I('compass')}</button></div><div class="tabbar" role="group" aria-label="产品场景"><button class="tab ${st.lane==='all'?'active':''}" data-lane="all">全部场景</button>${Object.entries(L).map(([id,l])=>`<button class="tab ${id==='market'?'market':''} ${st.lane===id?'active':''}" data-lane="${id}">${l.name}</button>`).join('')}</div><div class="filters"><div class="field searchfield"><label for="map-search">搜索产品、公司或需求</label><div class="searchwrap">${I('search')}<input id="map-search" placeholder="试试：患者流、Evidence plan、零氪" value="${E(st.q)}" autocomplete="off"></div></div><div class="field"><label for="filter-who">服务对象</label><select id="filter-who" data-filter="who">${option('all',st.who,'全部对象')}${['医生','患者','药企/机构'].map(v=>option(v,st.who)).join('')}</select></div><div class="field"><label for="filter-payer">付款路径</label><select id="filter-payer" data-filter="payer">${option('all',st.payer,'全部付款方')}${['药企市场部','药企医学/RWE','PI科研经费','药企患者支持','医院预算','商保','患者家庭','待核实'].map(v=>option(v,st.payer)).join('')}</select></div><div class="field"><label for="filter-kind">条目类型</label><select id="filter-kind" data-filter="kind">${option('all',st.kind,'全部类型')}${['拟开发','外部产品','对标线索'].map(v=>option(v,st.kind)).join('')}</select></div><button class="resetbtn" data-reset>重置</button></div><div class="resultbar"><div id="result-count" aria-live="polite"></div><div class="view-toggle"><button class="${st.view==='map'?'active':''}" data-view="map" aria-pressed="${st.view==='map'}">${I('map')}地图</button><button class="${st.view==='list'?'active':''}" data-view="list" aria-pressed="${st.view==='list'}">${I('list')}清单</button></div></div><div id="map-results"></div><p class="footnote">比较单位是具体产品或服务。同一公司可出现多个条目；这是代表性对标样本，不是完整市场名录。付款路径包含待验证的适配判断，详情逐项说明。<button class="detail-link" data-nav="sources">查看来源与证据口径</button></p>`}
function mapResults(){if(!$('map-results'))return;const a=filtered();$('result-count').innerHTML=`显示 <b>${a.length}</b> / ${P.length} 条 <span class="count-note">其中 ${a.filter(p=>p.kind==='拟开发').length} 项拟开发服务 · 可选择最多4项对比</span>`;if(!a.length){$('map-results').innerHTML='<div class="empty"><h3>没有符合条件的条目</h3><p>尝试缩短关键词，或放宽服务对象和付款方。</p><button class="btn" data-reset>清除筛选</button></div>';return}if(st.view==='list'){$('map-results').innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr><th>对比</th><th>公司 / 产品</th><th>场景</th><th>服务对象</th><th>付款路径（待逐项确认）</th><th>信息状态</th></tr></thead><tbody>${a.map(p=>`<tr data-card="${p.id}"><td>${selectButton(p)}</td><td><small class="muted">${E(p.brand)}</small><button class="product-title" data-detail="${p.id}">${E(p.name)}</button></td><td>${L[p.lane].name}</td><td>${E(p.users.join('、'))}</td><td>${E(p.payers.join('、'))}</td><td>${pill(p)}</td></tr>`).join('')}</tbody></table></div>`}else{$('map-results').innerHTML=`<div class="map-board ${st.lane!=='all'?'single':''}">${Object.entries(L).filter(([id])=>a.some(p=>p.lane===id)).map(([id,l])=>`<section class="lane" style="--lane-color:${l.color}"><div class="lane-heading"><h2>${I(l.icon)}${l.name}<span class="lane-count">${a.filter(p=>p.lane===id).length}</span></h2><small>${l.desc}</small></div><div class="lane-cards">${a.filter(p=>p.lane===id).map(card).join('')}</div></section>`).join('')}</div>`}}
function toggle(id){if(st.selected.includes(id))st.selected=st.selected.filter(x=>x!==id);else if(st.selected.length===4){toast('最多并排比较4项，请先移除一项。');return}else st.selected.push(id);persist();mapResults();tray();if($('compare').open){if(st.selected.length<2){$('compare').close();toast('至少保留2项才能并排比较。')}else compareContent()}}
function tray(){const a=st.selected.map(id=>P.find(p=>p.id===id)).filter(Boolean);$('compare-tray').hidden=!a.length;$('compare-tray').innerHTML=`${I('list')}<p>已选 ${a.length} / 4 <span class="tray-names">${a.map(p=>E(p.brand+' · '+p.name)).join('，')}</span></p><button class="btn" data-clear-compare><span class="clear-label">清空</span>${I('close')}</button><button class="btn primary" data-compare ${a.length<2?'disabled':''}>并排对比${a.length>=2?' ('+a.length+')':''}</button>`}
function detailBlock(title,value,focus=false){return `<section class="detail-block ${focus?'focus':''}"><h3>${title}</h3><p>${E(value)}</p></section>`}
function showDetail(id,record=true){const p=P.find(p=>p.id===id);if(!p)return;activeProduct=id;sourceBack=id;if(record)syncURL();$('drawer-head-label').textContent=L[p.lane].name+' / '+p.brand;$('drawer-body').innerHTML=`${pill(p)}<h2>${E(p.name)}</h2><p class="lead">${E(p.summary)}</p><div class="detail-grid"><div><small>使用者</small>${E(p.users.join('、'))}</div><div><small>付款路径 · 需确认</small>${E(p.payers.join('、'))}</div></div>${detailBlock('实际交付',p.deliver)}${detailBlock('AI承担什么',p.ai)}${detailBlock('谁负责专业工作与处理',p.human)}${detailBlock('数据与落地条件',p.data)}${detailBlock(p.kind==='拟开发'?'拟议计费 / 报价假设':'公开计费信息',p.pricing)}${detailBlock('适用边界与不确定性',p.boundary)}${detailBlock('对数智研的启示 · 分析判断',p.insight,true)}${detailBlock('下一步验证',p.verify)}<div class="link-row"><button class="btn accent" data-toggle="${p.id}">${st.selected.includes(p.id)?'移出对比':'加入对比'}</button><button class="btn" data-share="${p.id}">复制条目定位</button></div><section class="detail-block"><h3>依据与来源</h3>${p.refs.map(id=>`<button class="ref-link" data-source="${id}">${E(S.find(s=>s.id===id)?.title||id)} ${I('link')}</button>`).join('')}</section>`;if(!$('drawer').open)$('drawer').showModal();$('drawer').scrollTop=0}
function showSource(id){const s=S.find(s=>s.id===id);if(!s)return;$('drawer-head-label').textContent='证据与来源';$('drawer-body').innerHTML=`${sourceBack?`<button class="btn ghost" data-detail="${sourceBack}">${I('back')}返回产品分析</button>`:''}<div style="margin-top:18px"><span class="pill">${E(s.kind)}</span><h2>${E(s.title)}</h2><p class="small muted">资料读取 / 核验日期：${E(s.date)}</p></div>${detailBlock('本页使用范围',s.scope)}${detailBlock('不能据此得出的结论',s.limit,true)}${s.url?`<a class="btn" href="${E(s.url)}" target="_blank" rel="noopener noreferrer">打开原始来源 ${I('link')}</a>`:'<p class="muted small">本地公司材料或待核实线索，未提供公开网页链接。</p>'}`;if(!$('drawer').open)$('drawer').showModal();$('drawer').scrollTop=0}
function compareContent(){const a=st.selected.map(id=>P.find(p=>p.id===id));const different=new Set(a.map(p=>p.lane)).size>1;const rows=[['业务与购买理由','summary'],['使用者','users'],['付款路径 · 需逐项确认','payers'],['实际交付','deliver'],['AI与专业工作','_group'],['AI承担什么','ai'],['人工 / 临床责任','human'],['数据与实施条件','data'],['商业与进入判断','_group'],['计费 / 报价口径','pricing'],['限制与未知','boundary'],['数智研切入判断','insight'],['下一步验证','verify']];$('compare-body').innerHTML=`<div class="notice">${different?'<strong>当前跨场景比较：</strong>用于理解业务与交付方式，不构成功能或效果排名。':'<strong>当前同场景比较：</strong>拟开发服务与外部公开产品成熟度不同，不能直接认定能力优劣。'} 未取得同题测试与可比报价前，不计算总分。</div><div class="table-wrap"><table class="data-table compare-table"><thead><tr><th>比较维度</th>${a.map(p=>`<th>${pill(p)}<strong style="margin-top:8px">${E(p.brand)}</strong><strong>${E(p.name)}</strong><button class="btn" data-toggle="${p.id}">移除</button></th>`).join('')}</tr></thead><tbody>${rows.map(([label,key])=>key==='_group'?`<tr class="group-row"><td colspan="${a.length+1}">${label}</td></tr>`:`<tr><td>${label}</td>${a.map(p=>`<td>${E(Array.isArray(p[key])?p[key].join('、'):p[key])}</td>`).join('')}</tr>`).join('')}<tr><td>来源</td>${a.map(p=>`<td>${p.refs.map(id=>{const s=S.find(x=>x.id===id);return s.url?`<p><a href="${E(s.url)}" target="_blank" rel="noopener noreferrer">${E(s.title)}</a></p>`:`<p>${E(s.title)}</p>`}).join('')}</td>`).join('')}</tr></tbody></table></div>`}

const PILOT={market:{name:'市场部患者流研究',sub:'验证新增市场部业务',question:'HR阳性、HER2阴性晚期/转移性乳腺癌患者，从确诊到治疗启动的路径有哪些差异？哪些原因需要访谈解释？',deliver:'一个限定人群与观察期的患者流地图、变量与分母说明、访谈解释及白皮书/洞察报告。',accept:'数据解释准确、研究方法透明，回答一个预先约定的市场决策。',boundary:'先核实数据；未观察到后续治疗不直接定义为流失。白皮书形式不改变证据要求。',id:'aidm-flow'},pi:{name:'PI科研执行模块',sub:'验证经费与小项目成交',question:'在既有获批课题内，哪一项数据整理、质控或统计任务值得由数智研承担？',deliver:'固定病例/变量/修改轮次的数据、字典、溯源、代码或分析模块。',accept:'满足质量与课题任务要求，记录复核后工时、验收与机构付款。',boundary:'必须与在研任务及可用预算匹配。具体收费科目和采购方式由机构确认。',id:'aidm-pi'},medical:{name:'医学部证据项目',sub:'验证Evidence plan与RWE',question:'候选：CDK4/6抑制剂联合内分泌治疗启动后前12周，监测、调整和中断路径有哪些证据缺口？',deliver:'先付费规划/可行性；数据可行时再设计约200—300例回顾性研究，规模需重估。',accept:'可追溯地回答研究问题，方法可复现，并有明确后续决策用途。',boundary:'区分计划休药、医嘱调整与自行中断；处方间隔不能直接当作实际服药行为。',id:'aidm-evidence'},patient:{name:'治疗早期患者管理',sub:'验证服务与AI增量',question:'对于新启动上述口服治疗的患者，AI是否在保持服务质量的前提下减少医护净工时？',deliver:'候选1—2中心、60—100人，每人12周；症状、复查、转交及处理记录。规模为建议。',accept:'比较护理资源相近的服务流程；周完成率≥80%为待验证目标，高风险问题有处理记录。',boundary:'预算、触达和医护响应先落实。90天内验证启动条件，每人12周随访另行安排。',id:'aidm-care'}};

function pilotPage(){const x=PILOT[st.pilot]||PILOT.market;const c=st.checks[st.pilot]||{};const count=CHECKS.filter(([id])=>c[id]).length;return head('用试点决定是否组建团队','先以一个负责人组织医学、数据与商务资源。以真实购买、交付和项目经济性决定长期团队投入。')+`<div class="master-detail"><div class="master-list">${Object.entries(PILOT).map(([id,v])=>`<button class="master-item ${id===st.pilot?'active':''}" data-pilot="${id}"><strong>${v.name}</strong><small>${v.sub}</small></button>`).join('')}</div><article class="detail-panel"><span class="pill proposal">试点方案假设</span><h2 style="margin-top:12px">${x.name}</h2><dl class="kv-list">${[['研究/业务问题',x.question],['拟交付范围',x.deliver],['主要验收',x.accept],['启动边界',x.boundary]].map(([k,v])=>`<div class="kv"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl><div class="link-row"><button class="btn" data-detail="${x.id}">查看产品定义</button><button class="btn" data-export-pilot>导出验证记录</button></div><div class="section-gap"><h3>试点条件自检</h3><p class="muted small">仅保存你在本浏览器填写的状态。这是准备度清单，不是投资评分。</p><div class="progress-line"><div style="width:${count*20}%"></div></div><p id="check-count" class="small muted">已核实 ${count} / 5 项 · ${count===5?'可以组织试点评审，仍需实际订单与质量验证':'关键条件仍需核实'}</p><div class="checklist">${CHECKS.map(([id,h,sub])=>`<label class="check-row"><input type="checkbox" data-check="${id}" ${c[id]?'checked':''}><span><strong>${h}</strong><small>${sub}</small></span></label>`).join('')}</div><label class="small muted" for="pilot-note">验证记录 / 下一步负责人</label><textarea class="note-area" id="pilot-note" placeholder="记录已确认的任务、预算、人员和下一步行动。">${E(st.notes[st.pilot]||'')}</textarea></div></article></div><div class="timeline"><div><strong>第1—30天：需求与可行性</strong><p>访谈具体客户，核查病种数据，形成有预算可能的限定项目。</p></div><div><strong>第31—60天：报价与采购</strong><p>提交固定范围方案，验证价格接受、采购条件和团队投入。</p></div><div><strong>第61—90天：交付与决策</strong><p>交付可完成模块，核对质量、成本、付款和后续需求。</p></div></div><div class="notice section-gap"><strong>扩大投入：</strong>有真实付费、质量达标、正常报价覆盖可归属成本，并有相似需求。<br><strong>调整或停止：</strong>持续只有免费试用、关键数据无法落实、范围失控或交付成本无法覆盖。采购尚在推进时，需区分流程延迟与真实拒绝。</div>`}
function sourcesPage(){return head('每一项判断，都能追到依据','厂商官网用于核对公开定位，研究用于理解特定效果，公司材料用于描述披露的基础。不同来源不能互相替代。')+`<div class="notice"><strong>本版更新时间：2026年11月12日。</strong> 本轮新增创始人决策总览、临床医生端商业闭环判断、市场潜力分层和数智研服务介绍PDF的能力底座。前期规则与文献保留原核验日期；海心、若初仍为待核实线索。未取得竞品可比报价，不制作价格或效果排行榜。</div><div class="filters"><div class="field searchfield"><label for="source-search">搜索来源、主题或证据类型</label><div class="searchwrap">${I('search')}<input id="source-search" placeholder="例如：患者流、国自然、公司材料"></div></div></div><div id="source-results" class="source-list"></div><div class="version-line">版本 1.2 · 2026-11-12<br>公开定位、公司披露、方案假设与待核实线索分别标注。公司已披露能力不等于本页拟开发产品已经上线。本地版本支持离线浏览；打开外部来源需要联网。</div>`}

function exportCSV(){const cols=[['公司','brand'],['产品','name'],['场景','lane'],['类型','kind'],['服务对象','users'],['付款路径','payers'],['公开信息状态','evidence'],['交付物','deliver'],['AI作用','ai'],['专业责任','human'],['计费口径','pricing'],['边界','boundary'],['来源','refs']];const cell=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=filtered().map(p=>cols.map(([h,k])=>cell(k==='lane'?L[p.lane].name:k==='refs'?p.refs.map(id=>{const s=S.find(s=>s.id===id);return s.url||s.title}).join('\n'):Array.isArray(p[k])?p[k].join('、'):p[k])).join(','));download('数智研_当前筛选_'+rows.length+'条.csv','\ufeff'+cols.map(x=>cell(x[0])).join(',')+'\r\n'+rows.join('\r\n'),'text/csv;charset=utf-8');toast('已导出当前筛选的 '+rows.length+' 条记录。')}

async function share(){const link=location.href;try{await navigator.clipboard.writeText(link);toast(location.protocol==='file:'?'已复制本地定位。跨设备分享时请同时发送HTML文件。':'已复制条目链接。')}catch{toast('可直接复制浏览器地址栏中的条目定位。')}}
function reset(){Object.assign(st,{lane:'all',who:'all',payer:'all',kind:'all',q:''});syncURL();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){nav(d.nav);return}if(d.lane){st.lane=d.lane;syncURL();render();return}if('reset'in d){reset();return}if(d.view){st.view=d.view;syncURL();render();return}if(d.toggle){toggle(d.toggle);if($('drawer').open&&activeProduct===d.toggle){showDetail(d.toggle,false)}return}if(d.detail){showDetail(d.detail);return}if(d.source){if(!$('drawer').open)sourceBack=null;showSource(d.source);return}if('compare'in d){compare();return}if('clearCompare'in d){st.selected=[];persist();tray();mapResults();return}if(d.close){$(d.close).close();return}if('menu'in d){$('sidebar').classList.toggle('open');$('scrim').classList.toggle('open');menuSync();return}if(d.journey){st.journey=d.journey;st.step=0;render();return}if('step'in d){st.step=Number(d.step);render();return}if(d.related){st.lane=d.related;st.kind='all';st.q='';st.who='all';st.payer='all';nav('map');return}if(d.pay){st.pay=d.pay;render();return}if(d.pilot){st.pilot=d.pilot;render();return}if('example'in d){st.numbers={revenue:45000,labor:18000,external:5000,sales:3000};render();toast('已载入演算示例，数字不代表市场报价。');return}if('exportPilot'in d){exportPilot();return}if('share'in d){share();return}if('export'in d){exportCSV();return}if('print'in d){document.body.classList.toggle('print-dialog',!!document.querySelector('dialog[open]'));window.print();return}});
document.addEventListener('input',e=>{if(e.target.id==='map-search'){st.q=e.target.value;mapResults();syncURL()}if(e.target.id==='source-search')sourceResults(e.target.value);if(e.target.id==='pilot-note'){st.notes[st.pilot]=e.target.value;persist()}if(e.target.dataset.number){const key=e.target.dataset.number;st.numbers[key]=Math.max(0,Number(e.target.value)||0);calc();persist()}});
document.addEventListener('change',e=>{if(e.target.dataset.filter){st[e.target.dataset.filter]=e.target.value;mapResults();syncURL()}if(e.target.dataset.check){st.checks[st.pilot]??={};st.checks[st.pilot][e.target.dataset.check]=e.target.checked;persist();const count=CHECKS.filter(([id])=>st.checks[st.pilot][id]).length;$('check-count').textContent=`已核实 ${count} / 5 项 · ${count===5?'可以组织试点评审，仍需实际订单与质量验证':'关键条件仍需核实'}`;document.querySelector('.progress-line>div').style.width=count*20+'%'}});
$('scrim').addEventListener('click',()=>{$('sidebar').classList.remove('open');$('scrim').classList.remove('open');menuSync()});
$('drawer').addEventListener('close',()=>{activeProduct=null;sourceBack=null;syncURL()});
for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))d.close()});
window.addEventListener('afterprint',()=>document.body.classList.remove('print-dialog'));
window.addEventListener('popstate',()=>{hashRead();const target=activeProduct;render();if(target)showDetail(target,false);else if($('drawer').open)$('drawer').close()});
window.addEventListener('hashchange',()=>{hashRead();const target=activeProduct;render();if(target)showDetail(target,false)});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(st.page!=='map')nav('map');$('map-search').focus()}});
for(const el of document.querySelectorAll('[data-icon]'))el.innerHTML=I(el.dataset.icon);
if(location.hash)hashRead();else st.page='overview';const initialProduct=activeProduct;render();if(initialProduct)showDetail(initialProduct,false);syncURL();

window.addEventListener('resize',menuSync);menuSync();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sidebar').classList.contains('open')){$('sidebar').classList.remove('open');$('scrim').classList.remove('open');menuSync();document.querySelector('[data-menu]').focus()}});
</script>
</body></html>
